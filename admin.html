<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrador | Cesta de Gon</title>
<style>
body{font-family:Arial;background:#f8f5ed;margin:0;color:#26382e}
header{background:#173d30;color:white;padding:25px;text-align:center}
main{max-width:1000px;margin:25px auto;padding:15px}
.card{background:white;border-radius:12px;padding:20px;margin:15px 0}
input{padding:12px;width:95%;margin:8px 0;border:1px solid #ccc;border-radius:7px}
button{padding:11px 16px;background:#173d30;color:white;border:0;border-radius:7px;cursor:pointer;margin:4px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.oculto{display:none}
</style>
</head>
<body>
<header>
<h1>🎄 Panel de Administrador</h1>
<p>III Cesta de Navidad de Gon</p>
</header>
<main>
<section class="card">
<h2>Acceso privado</h2>
<p>Inicia sesión con tu cuenta de administrador.</p>
<input id="email" type="email" placeholder="Correo electrónico">
<input id="password" type="password" placeholder="Contraseña">
<button onclick="entrar()">ENTRAR</button>
<p id="mensaje"></p>
</section>

<section id="panel" class="oculto">
<div class="card">
<h2>Bienvenido al panel</h2>
<button onclick="cargarPedidos()">Actualizar pedidos</button>
<button onclick="salir()">Cerrar sesión</button>
</div>
<div class="card">
<h2>Solicitudes de papeletas</h2>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Cliente</th>
<th>Sorteo</th>
<th>Cantidad</th>
<th>Total</th>
<th>Estado</th>
</tr>
</thead>
<tbody id="pedidos"></tbody>
</table>
</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://dfbsbbzvxuqypeowtvld.supabase.co";
const CLAVE="sb_publishable_TMJmvhwo-K8fnBhAOGEryg_XWHetqoZ";
const db=window.supabase.createClient(URL,CLAVE);

async function entrar(){
 const {error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value,
  password:document.getElementById("password").value
 });
 document.getElementById("mensaje").textContent=
 error?error.message:"Sesión iniciada.";
 if(!error){
  document.getElementById("panel").classList.remove("oculto");
  cargarPedidos();
 }
}

async function cargarPedidos(){
 const {data,error}=await db.from("pedidos")
 .select("*").order("creado_en",{ascending:false});
 if(error){alert("Error: "+error.message);return;}
 const tabla=document.getElementById("pedidos");
 tabla.innerHTML="";
 data.forEach(p=>{
  const fila=document.createElement("tr");
  [p.nombre,p.sorteo,p.cantidad,p.total+" €",p.estado]
  .forEach(valor=>{
   const celda=document.createElement("td");
   celda.textContent=valor??"";
   fila.appendChild(celda);
  });
  tabla.appendChild(fila);
 });
}

async function salir(){
 await db.auth.signOut();
 document.getElementById("panel").classList.add("oculto");
}
</script>
</body>
</html>
